
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Twinkle Time</title>
  <style>
    body { font-family: sans-serif; background: #0d0d14; color: #fff; padding: 20px; margin: 0; }
    .container { max-width: 500px; margin: auto; }
    .card { background: #181824; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #333; }
    h2, h3 { color: #ff007f; margin-top: 0; }
    input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #444; background: #222; color: #fff; box-sizing: border-box; }
    button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: none; background: linear-gradient(135deg, #e91e63, #9c27b0); color: white; font-weight: bold; cursor: pointer; }
    .hidden { display: none; }
    .item { display: flex; justify-content: space-between; align-items: center; background: #222; padding: 10px; margin: 5px 0; border-radius: 8px; }
  </style>
</head>
<body>
<div class="container">
  
  <!-- LOGIN -->
  <div id="login-sec" class="card">
    <h2>👑 Owner Login</h2>
    <input type="password" id="pin" placeholder="Enter PIN (Default: 1234)">
    <button onclick="checkLogin()">Login</button>
  </div>

  <!-- ADMIN PANEL -->
  <div id="admin-sec" class="hidden">
    
    <!-- PRODUCTS -->
    <div class="card">
      <h3>➕ Manage Products</h3>
      <input type="text" id="p-name" placeholder="Product Name">
      <input type="text" id="p-img" placeholder="Image URL">
      <button onclick="addProd()">Add Product</button>
      <div id="p-list" style="margin-top:10px;"></div>
    </div>

    <!-- PROFILE & LOCATION -->
    <div class="card">
      <h3>🖼️ Profile & Location</h3>
      <input type="text" id="o-photo" placeholder="Owner Photo URL (Circle)">
      <input type="text" id="t-photo" placeholder="Team Photo URL">
      <input type="text" id="s-name" placeholder="Store/School Name">
      <input type="text" id="m-url" placeholder="Google Maps URL">
      <button onclick="saveAll()">Save All Details</button>
    </div>

    <!-- PIN -->
    <div class="card">
      <h3>🔑 Security</h3>
      <input type="password" id="new-pin" placeholder="New PIN">
      <button onclick="savePin()">Change PIN</button>
    </div>
    
    <button onclick="location.reload()" style="background:#444;">Logout</button>
  </div>
</div>

<script>
  function checkLogin() {
    let pin = document.getElementById('pin').value;
    if(pin == "1234" || pin == localStorage.getItem('my_pin')) {
      document.getElementById('login-sec').classList.add('hidden');
      document.getElementById('admin-sec').classList.remove('hidden');
      renderProds();
    } else { alert("गलत PIN!"); }
  }

  function addProd() {
    let prods = JSON.parse(localStorage.getItem('prods') || "[]");
    prods.push({n: document.getElementById('p-name').value, i: document.getElementById('p-img').value});
    localStorage.setItem('prods', JSON.stringify(prods));
    alert("प्रोडक्ट जुड़ गया!");
    document.getElementById('p-name').value = '';
    document.getElementById('p-img').value = '';
    renderProds();
  }

  function renderProds() {
    let prods = JSON.parse(localStorage.getItem('prods') || "[]");
    document.getElementById('p-list').innerHTML = prods.map((p,i) => `
      <div class="item"><span>${p.n}</span><button onclick="del(${i})" style="width:auto; padding:5px; background:red;">Delete</button></div>
    `).join('');
  }

  function del(i) {
    let prods = JSON.parse(localStorage.getItem('prods'));
    prods.splice(i, 1);
    localStorage.setItem('prods', JSON.stringify(prods));
    renderProds();
  }

  function saveAll() {
    localStorage.setItem('o_photo', document.getElementById('o-photo').value);
    localStorage.setItem('t_photo', document.getElementById('t-photo').value);
    localStorage.setItem('s_name', document.getElementById('s-name').value);
    localStorage.setItem('m_url', document.getElementById('m-url').value);
    alert("सारी जानकारी Save हो गई!");
  }

  function savePin() {
    localStorage.setItem('my_pin', document.getElementById('new-pin').value);
    alert("PIN बदल गया!");
  }
</script>
</body>
</html>
