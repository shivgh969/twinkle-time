<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - TWINKLE TIME</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
    body { background-color: #0c0c14; color: #ffffff; padding: 20px 12px; }
    .container { max-width: 500px; margin: 0 auto; }
    h1 { font-size: 22px; color: #ec4899; text-align: center; margin-bottom: 20px; }
    .card { background: #141420; border: 1px solid #232336; border-radius: 18px; padding: 18px; margin-bottom: 20px; }
    .card h2 { font-size: 16px; color: #c084fc; margin-bottom: 12px; border-bottom: 1px solid #232336; padding-bottom: 6px; }
    label { font-size: 12px; color: #94a3b8; display: block; margin: 10px 0 4px 0; }
    input { width: 100%; padding: 10px; background: #1a1a28; border: 1px solid #2e2e48; border-radius: 8px; color: white; font-size: 13px; }
    button { width: 100%; padding: 12px; background: linear-gradient(90deg, #9333ea, #db2777); border: none; border-radius: 25px; color: white; font-weight: bold; margin-top: 14px; cursor: pointer; }
    .prod-item { display: flex; align-items: center; justify-content: space-between; background: #1a1a28; padding: 10px 12px; border-radius: 10px; margin-bottom: 8px; font-size: 13px; }
    .del-btn { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; width: auto; margin-top: 0; }
    .back-btn { display: inline-block; background: #2563eb; color: white; text-decoration: none; padding: 10px 18px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-bottom: 15px; }
  </style>
</head>
<body>

<div class="container">
  <a href="index.html" class="back-btn">⬅️ वेबसाइट पर वापस जाएं</a>
  <h1>👑 TWINKLE TIME - Owner Panel</h1>

  <!-- 1. Add / Edit Products -->
  <div class="card">
    <h2>🛍️ नया प्रोडक्ट जोड़ें</h2>
    <label>प्रोडक्ट का नाम (उदा. Samosa):</label>
    <input type="text" id="p-name" placeholder="जैसे: Samosa">
    
    <label>कीमत (₹):</label>
    <input type="number" id="p-price" placeholder="जैसे: 20">
    
    <label>फोटो का लिंक (Image URL):</label>
    <input type="text" id="p-img" placeholder="https://...">

    <label>डिस्क्रिप्शन (उदा. Crispy and delicious snacks):</label>
    <input type="text" id="p-desc" placeholder="जैसे: Crispy and delicious snacks">

    <button onclick="addProduct()">➕ प्रोडक्ट सेव करें</button>
  </div>

  <!-- 2. Manage Products List (Delete Option) -->
  <div class="card">
    <h2>🗑️ प्रोडक्ट डिलीट करें</h2>
    <div id="admin-prod-list"></div>
  </div>

  <!-- 3. Team Photo Upload -->
  <div class="card">
    <h2>📸 Team Photo / Poster अपलोड करें</h2>
    <label>टीम फोटो की इमेज का URL डालें:</label>
    <input type="text" id="team-photo-url" placeholder="https://...">
    <button onclick="saveTeamPhoto()">🖼️ फोटो अपडेट करें</button>
  </div>

  <!-- 4. Store Info Update -->
  <div class="card">
    <h2>🏫 स्कूल व स्टोर की जानकारी</h2>
    <label>स्कूल का नाम:</label>
    <input type="text" id="school-name-input" placeholder="Government Senior Secondary School Mubarakpur">

    <label>Google Maps लिंक:</label>
    <input type="text" id="maps-url-input" placeholder="https://maps.google.com/...">

    <label>Contact Email:</label>
    <input type="text" id="email-input" placeholder="twinkletime@gmail.com">

    <button onclick="saveStoreDetails()">💾 विवरण सेव करें</button>
  </div>
</div>

<script>
  function getProds() {
    const p = localStorage.getItem('twinkle_prods');
    return p ? JSON.parse(p) : [];
  }

  function renderAdminProds() {
    const prods = getProds();
    const list = document.getElementById('admin-prod-list');
    if (prods.length === 0) {
      list.innerHTML = "<p style='color:#777;'>कोई प्रोडक्ट नहीं है।</p>";
      return;
    }
    list.innerHTML = prods.map(p => `
      <div class="prod-item">
        <span><b>${p.n}</b> - ₹${p.p}</span>
        <button class="del-btn" onclick="deleteProd(${p.id})">हटाएं 🗑️</button>
      </div>
    `).join('');
  }

  function addProduct() {
    const n = document.getElementById('p-name').value.trim();
    const p = document.getElementById('p-price').value.trim();
    const i = document.getElementById('p-img').value.trim();
    const desc = document.getElementById('p-desc').value.trim();

    if (!n) { alert("कृपया प्रोडक्ट का नाम दर्ज करें!"); return; }

    const prods = getProds();
    prods.push({ id: Date.now(), n, p, i, desc });
    localStorage.setItem('twinkle_prods', JSON.stringify(prods));
    
    document.getElementById('p-name').value = '';
    document.getElementById('p-price').value = '';
    document.getElementById('p-img').value = '';
    document.getElementById('p-desc').value = '';
    
    renderAdminProds();
    alert("✅ प्रोडक्ट सफलतापूर्वक जोड़ दिया गया!");
  }

  function deleteProd(id) {
    let prods = getProds();
    prods = prods.filter(p => p.id !== id);
    localStorage.setItem('twinkle_prods', JSON.stringify(prods));
    renderAdminProds();
    alert("🗑️ प्रोडक्ट हटा दिया गया है!");
  }

  function saveTeamPhoto() {
    const url = document.getElementById('team-photo-url').value.trim();
    if (!url) { alert("फोटो URL डालें!"); return; }
    localStorage.setItem('twinkle_team_photo', url);
    alert("✅ टीम फोटो अपडेट हो गई!");
  }

  function saveStoreDetails() {
    const sn = document.getElementById('school-name-input').value.trim();
    const mu = document.getElementById('maps-url-input').value.trim();
    const em = document.getElementById('email-input').value.trim();

    if (sn) localStorage.setItem('twinkle_school_name', sn);
    if (mu) localStorage.setItem('twinkle_maps_url', mu);
    if (em) localStorage.setItem('twinkle_email', em);

    alert("✅ स्कूल व लोकेशन डिटेल्स सेव हो गईं!");
  }

  window.onload = function() {
    renderAdminProds();
    document.getElementById('team-photo-url').value = localStorage.getItem('twinkle_team_photo') || '';
    document.getElementById('school-name-input').value = localStorage.getItem('twinkle_school_name') || 'Government Senior Secondary School Mubarakpur';
    document.getElementById('maps-url-input').value = localStorage.getItem('twinkle_maps_url') || '';
    document.getElementById('email-input').value = localStorage.getItem('twinkle_email') || 'twinkletime@gmail.com';
  };
</script>

</body>
</html>
